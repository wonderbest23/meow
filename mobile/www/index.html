<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘창업</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, system-ui, sans-serif; background: #fff; color: #111; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  button { margin-top: 16px; font-size: 16px; padding: 12px 20px; border-radius: 10px; border: 0; background: #111; color: #fff; }
  @media (prefers-color-scheme: dark) { button { background: #eee; color: #111; } }
</style>
</head>
<body>
  <!-- 앱은 운영 사이트를 연다. 인터넷이 끊겨 사이트를 못 열 때만 이 화면이 보인다. -->
  <main>
    <h1>오늘창업</h1>
    <p>인터넷에 연결되어 있지 않아요.<br>연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button onclick="location.href='https://oneulstart.com'">다시 시도</button>
  </main>
</body>
</html>
